<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeTutor AI - an AI-powered programming tutor that teaches step by step, adapts to your level, and reviews your code." />
    <title>CodeTutor AI - Learn to Code with a Personal AI Tutor</title>
    <script>
      // Apply the stored theme before paint to avoid a flash of the wrong theme.
      try {
        const t = localStorage.getItem("codetutor.theme") || "dark";
        document.documentElement.classList.toggle("dark", t === "dark");
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
